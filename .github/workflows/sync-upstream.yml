name: Sync upstream pstack

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt
      - name: Test the trusted synchronizer
        run: python -m unittest discover -s tests -v
      - name: Read upstream history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cursor/plugins
          ref: main
          path: .upstream
          fetch-depth: 0
          sparse-checkout: pstack
          persist-credentials: false
      - name: Synchronize authoritative upstream and publish to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python scripts/publish_sync.py
          --upstream-dir .upstream
          --report "${{ runner.temp }}/pstack-sync-report.json"
      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pstack-sync-report
          path: ${{ runner.temp }}/pstack-sync-report.*
          if-no-files-found: warn
